<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 | Pawsh Fashion</title>
    <meta name="description" content="聯繫 Pawsh Fashion 團隊以獲得支援或諮詢。">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="assets/logo.png" alt="Pawsh Fashion Logo">
            <span>Pawsh Fashion</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於我們</a></li>
            <li><a href="casual-wear.html">休閒服飾</a></li>
            <li><a href="toys.html">玩具</a></li>
            <li><a href="accessories.html">飾品</a></li>
            <li><a href="parts.html">配件</a></li>
            <li><a href="other.html">其它類</a></li>
            <li><a href="contact.html">聯絡我們</a></li>
        </ul>
    </nav>

    <section style="margin-top: 100px;">
        <div class="section-title">
            <h2>聯繫我們</h2>
            <p>我們很樂意聽取您與您毛孩的想法。</p>
        </div>
        
        <form class="contact-form" onsubmit="event.preventDefault(); alert('訊息已送出！');">
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" placeholder="您的姓名" required>
            </div>
            <div class="form-group">
                <label for="email">電子郵件</label>
                <input type="email" id="email" placeholder="您的電子郵件" required>
            </div>
            <div class="form-group">
                <label for="message">訊息內容</label>
                <textarea id="message" rows="5" placeholder="我們能為您提供什麼幫助？" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">送出訊息</button>
        </form>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Pawsh Fashion</h3>
                <p>為值得最好的寵物提供頂級生活風格精品。</p>
            </div>
            <div class="footer-section">
                <h3>快速連結</h3>
                <ul class="footer-links">
                    <li><a href="about.html">我們的故事</a></li>
                    <li><a href="contact.html">聯絡我們</a></li>
                    <li><a href="casual-wear.html">新品上市</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>聯絡資訊</h3>
                <ul class="footer-links">
                    <li>support@pawshfashion.com</li>
                    <li>123 Pet Lane, Luxury City</li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Pawsh Fashion Boutique. 版權所有。
        </div>
    </footer>
</body>
</html>
